# Checks only: no secrets, no image builds (images are built locally; PLAN §14.5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Install
        run: cd backend && uv sync --locked
      - name: Lint
        run: cd backend && uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: cd backend && uv run pyright
      - name: Tests
        run: cd backend && uv run pytest -q --disable-socket --allow-unix-socket
      - name: Migrations
        run: just migrations-check
      - name: Kiosk scripts
        run: just kiosk-lint

  # Sunroom Screen's agent on the three systems it runs on (docs/M7.md T6).
  kiosk:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kiosk/agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Tests
        run: uv run pytest -q
      # The installer's plan on each system, changing nothing (docs/M7.md T8): macOS's own
      # bash 3.2, and Git Bash on Windows.
      - name: Installer dry run
        working-directory: .
        shell: bash
        run: |
          shell=bash
          if [ "$RUNNER_OS" = macOS ]; then shell=/bin/bash; fi
          "$shell" kiosk/install.sh --dry-run
          "$shell" kiosk/install.sh --dry-run --display-only --url https://calendar.example.com
      # The Windows installer (docs/M7.md T14): PSScriptAnalyzer, then its plan under Windows
      # PowerShell 5.1, which is what `irm … | iex` runs: from a file, then as people run it, in the
      # window itself under Windows' default policy, Restricted (ADR 0041). There it shows an error
      # without exiting, so the plan's last line is the check. Write-Host is an installer's own voice.
      - name: Windows installer
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $found = Invoke-ScriptAnalyzer -Path kiosk/install.ps1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost
          $found | Format-Table -AutoSize RuleName, Line, Message | Out-String -Width 200 | Write-Host
          if ($found) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File kiosk/install.ps1 -DryRun
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File kiosk/install.ps1 -DryRun -Url https://calendar.example.com
          if ($LASTEXITCODE) { exit 1 }
          $plan = powershell -NoProfile -ExecutionPolicy Restricted -Command '& ([scriptblock]::Create((Get-Content -Raw kiosk/install.ps1))) -DryRun' | Out-String
          Write-Host $plan
          if ($plan -notmatch "nothing needs an administrator") { exit 1 }

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint . && pnpm exec prettier --check .
      - name: Types
        run: pnpm exec tsc -b
      - name: Tests
        run: pnpm exec vitest run

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd backend && uv sync --locked
      - run: cd kiosk/agent && uv sync --locked
      - run: cd frontend && pnpm install --frozen-lockfile
      - name: API types are up to date
        run: just api-types-check
      - name: Release metadata
        run: just release-meta-check

  e2e:
    runs-on: ubuntu-24.04
    # A whole run is about 20 minutes on this runner; a hung one stops here, not at 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd backend && uv sync --locked
      # Sunroom Screen's agent, in --fake mode beside the server (scripts/e2e-server.sh).
      - run: cd kiosk/agent && uv sync --locked
      - run: cd frontend && pnpm install --frozen-lockfile
      - name: Playwright's version
        id: playwright
        run: echo "version=$(cd frontend && pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache the browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: cd frontend && pnpm exec playwright install --with-deps chromium webkit
      - name: Install the browsers' system libraries (the browsers came from the cache)
        if: steps.browsers.outputs.cache-hit == 'true'
        run: cd frontend && pnpm exec playwright install-deps chromium webkit
      - name: End-to-end tests (wall screen, phones on WebKit and Chromium, a laptop)
        run: just e2e
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned)
        run: |
          curl -sSLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner .
