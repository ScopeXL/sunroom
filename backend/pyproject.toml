[project]
name = "sunroom"
version = "0.0.0" # The real version lives in ../VERSION (Dinner Bell's ADR 0019, kept here).
description = "Sunroom: a self-hosted family wall calendar."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.22",
    "alembic>=1.20",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
    "httpx>=0.28",
    "cryptography>=50",
    "tzdata>=2026.5",
    "pillow>=12.3",
    "pillow-heif>=1.8",
    "icalendar>=7",
    "x-wr-timezone>=2",
    "holidays>=0.80",
]

[project.scripts]
sunroom = "sunroom.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-socket>=0.8",
    "hypothesis>=6.168",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "watchfiles>=1.3",
    "python-dateutil>=2.9",
    "recurring-ical-events>=3",
    "types-python-dateutil>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunroom"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["src/sunroom/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "RUF", "S", "ASYNC", "DTZ"]
ignore = [
    "S101", # assert is fine in tests and for invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/sunroom/migrations/versions"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportPrivateUsage = false },
    { root = "src" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
