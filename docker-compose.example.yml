# Sunroom with Docker Compose (docs/DEPLOY.md). Save this as docker-compose.yml in a folder of its
# own on the server (for example /opt/sunroom), fill in what applies, here or in a .env beside it,
# and run `docker compose up -d`. It also works pasted into Portainer as a stack.
# Placeholders only; never commit real values. Nothing here is required: leave a variable empty
# and Sunroom does without it.
services:
  sunroom:
    image: scopexl/sunroom:latest # or pin a version, e.g. scopexl/sunroom:0.1.0
    container_name: sunroom
    restart: unless-stopped
    environment:
      TZ: ${TZ:-} # the household's time zone, e.g. America/New_York (also settable in the app)
      # Optional. Behind your own HTTPS reverse proxy nothing is needed. To make Sunroom answer
      # only to the names you list (a lock against DNS rebinding, docs/REMOTE-ACCESS.md):
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-} # e.g. calendar.example.com (or *.example.com)
      # Optional: a household password that always wins over the one chosen in setup (8+
      # characters), and a secret key (generated on the volume when left empty).
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      # How Sunroom words the way to update it: docker, portainer, unraid, casaos, synology or other.
      SUNROOM_INSTALL_KIND: ${SUNROOM_INSTALL_KIND:-docker}
    volumes:
      # The sunroom_data volume (the volumes: block at the end creates it): correct ownership with
      # no extra steps. The database, nightly backups and photos all live here, so back up the
      # whole volume. A host folder instead needs `user:` set to the folder's owner, see below.
      - sunroom_data:/data
    # With a host folder at /data instead of the volume: run as the folder's owner (id -u, id -g).
    # user: "1000:1000"
    ports:
      # host:container. Another app on 7867? Change only the left number, e.g. "7868:7867".
      # Or remove these lines and put the container on your proxy's Docker network.
      - "7867:7867"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Keep this block: it creates the volume above, named exactly sunroom_data (RESTORE.md uses it).
volumes:
  sunroom_data:
    name: sunroom_data
