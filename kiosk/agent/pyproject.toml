[project]
name = "sunroom-kiosk"
# Equals ../../VERSION: scripts/release.py writes it and scripts/check_release_meta.py checks it.
version = "0.17.0"
description = "Sunroom Screen: runs a Sunroom wall screen, its browser, its sleep and its settings."
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142",
    "uvicorn>=0.54",
    "pydantic>=2.13",
    "httpx>=0.28",
    "zeroconf>=0.147",
    "ifaddr>=0.2",
    "websockets>=15",
]

[project.scripts]
sunroom-kiosk = "sunroom_kiosk.cli:main"

# The same command with no console window, for Windows' Startup folder (install.ps1); elsewhere
# it's just a second name.
[project.gui-scripts]
sunroom-kioskw = "sunroom_kiosk.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "tzdata>=2026.5", # zoneinfo's data for the tests on Windows, which has none of its own
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunroom_kiosk"]
# The screen's own pages, built by the frontend (vite.screen.config.ts); gitignored, so named.
artifacts = ["src/sunroom_kiosk/static/**"]

# The installer's templates and helpers travel in the wheel (ADR 0044): `sunroom-kiosk setup`
# writes the screen's own start-up files from them, and the root helper takes the system's part
# out of a checked wheel.
[tool.hatch.build.targets.wheel.force-include]
"../files" = "sunroom_kiosk/files"
"../uninstall.sh" = "sunroom_kiosk/files/uninstall.sh"
"../labwc-rule.py" = "sunroom_kiosk/files/labwc-rule.py"
"../update.sh" = "sunroom_kiosk/files/update.sh"
# The words (ADR 0043): the agent's English and the screen's pages' languages.
"../../lang" = "sunroom_kiosk/lang"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "RUF", "S", "ASYNC", "DTZ"]
ignore = [
    "S101", # assert is fine in tests and for invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
executionEnvironments = [
    { root = "tests", extraPaths = ["."], reportPrivateUsage = false },
    { root = "src" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
